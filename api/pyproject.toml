[project]
name = "sms-ledger-api"
version = "0.1.0"
description = "Ingest and parsing service for the SMS ledger"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# httpx2, not httpx: current Starlette's TestClient imports httpx2 and raises a
# RuntimeError naming it if only httpx is present. verify_endpoints.py is the
# only thing that needs it.
dev = ["pytest>=8.3", "httpx2>=0.28"]

[tool.vercel]
entrypoint = "main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
