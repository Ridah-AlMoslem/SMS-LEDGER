[project]
name = "sms-ledger-api"
version = "0.1.0"
description = "Ingest and parsing service for the SMS ledger"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.vercel]
entrypoint = "main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
